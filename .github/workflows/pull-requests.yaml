name: Gradle PR Sanity Check

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gradle-check:
    name: Configure build tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run script unit tests
        # Covers the service catalog validation and the matrix resolution script.
        run: python3 -m unittest discover -s .github/scripts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run `gradle tasks`
        run: ./gradlew tasks --all
name: Spec Coverage
run-name: Spec Coverage

# A spec release in Adyen/adyen-openapi produces no pull request here, so drift between
# the published specs and the service catalog is invisible to every other workflow. The
# schedule is what catches it; the pull_request trigger additionally guards catalog edits.
#
# Gaps are informational: this workflow never edits the catalog or opens a PR.
# Missing spec files are warnings too. Malformed configuration still fails.

on:
  schedule:
    # Weekday mornings (UTC), after the usual spec release window.
    - cron: '30 7 * * 1-5'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'config/services.json'
      - 'config/spec-coverage-baseline.json'
      - '.github/scripts/check_spec_coverage.py'
      - '.github/scripts/test_check_spec_coverage.py'
      - '.github/workflows/spec-coverage.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: spec-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Compare published specs with the service catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Mirrors the `specs` Gradle task, which clones the spec repository into schema/.
      - name: Check out the OpenAPI specs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: Adyen/adyen-openapi
          path: schema

      - name: Report the OpenAPI commit under test
        run: echo "adyen-openapi at $(git -C schema rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Compare specs with the catalog
        run: python3 .github/scripts/check_spec_coverage.py --summary "$GITHUB_STEP_SUMMARY"
